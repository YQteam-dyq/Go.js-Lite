name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint backend modules and entry point
        run: |
          find backend -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l api.php
          php -l router.php
          php -l webcron.php

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 原来的注释说“项目未安装 eslint”，这个原因不准确：eslint 本来就在
      # devDependencies 里，真正的原因是 .eslintrc.json 有两处配置错误
      # （extends 少了 `plugin:` 前缀、rules 里把插件名 `react-hooks` 当成了规则名），
      # 导致 lint 一执行就报错，所以之前被整段注释掉了。
      #
      # 配置已在本次提交修复。代码里仍遗留若干历史问题（见 lint 报告），
      # 所以先以非阻断方式跑，把报告输出到 PR；等清理干净后再去掉
      # `continue-on-error`，切换为真正的门禁。
      - name: Lint
        continue-on-error: true
        run: npx eslint . --ext ts,tsx

      - name: Build
        run: npm run build
