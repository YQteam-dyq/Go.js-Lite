<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Go.js - Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --fg: #14181f;
        --muted: #5b6472;
        --card: #ffffff;
        --border: #e2e6ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --fg: #eef1f5;
          --muted: #9aa4b2;
          --card: #171b22;
          --border: #262c36;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        background: #00c2a0;
        color: #04231d;
      }
      ul {
        margin: 0 0 20px;
        padding-left: 20px;
        text-align: left;
        font-size: 13px;
        line-height: 1.8;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The Go.js control panel needs a network connection to talk to your server.</p>
      <ul>
        <li>The cached interface stays available.</li>
        <li>Requests are queued until the connection returns.</li>
        <li>Data shown may be out of date.</li>
      </ul>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
