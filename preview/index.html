<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Go.js-Lite Preview</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 16px; line-height: 1.55; }
  h1 { margin-bottom: 4px; }
  .sub { color: #6b7280; margin-bottom: 24px; }
  .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 16px; background: #fff; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { padding: 6px 12px; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 6px; cursor: pointer; }
  button.primary { background: #2563eb; color: white; border-color: #1d4ed8; }
  pre { background: #0b1020; color: #d1d5db; padding: 12px; border-radius: 8px; overflow:auto; max-height: 320px; font-size: 12px; }
  .ok { color:#059669; } .err{ color:#dc2626; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; }
  .stat { background:#f3f4f6; border-radius:8px; padding:12px; }
  .stat b { display:block; font-size: 18px; }
  .badge { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background:#e0e7ff; color:#3730a3; }
</style>
</head>
<body>
<h1>Go.js-Lite 本地预览</h1>
<div class="sub">PHP 后端已运行 <span class="badge">http://localhost:8080</span> · 本页面 <span class="badge">http://localhost:5500</span></div>

<div class="card">
  <h3>1. 后端连通性</h3>
  <div class="row">
    <button class="primary" onclick="testBackend()">测试 /gojs/api.php</button>
    <button onclick="testSystem()">system.info</button>
    <button onclick="testHealth()">monitor/status</button>
    <button onclick="testFiles()">files/list</button>
  </div>
  <pre id="backend-output">点击按钮测试后端 API...</pre>
</div>

<div class="card">
  <h3>2. 系统指标（实时）</h3>
  <div class="row">
    <button class="primary" onclick="startMetrics()">开始采样</button>
    <button onclick="stopMetrics()">停止</button>
  </div>
  <div class="grid" style="margin-top:12px">
    <div class="stat"><span>CPU</span><b id="cpu">—</b></div>
    <div class="stat"><span>内存</span><b id="mem">—</b></div>
    <div class="stat"><span>响应时间</span><b id="rtt">—</b></div>
    <div class="stat"><span>样本数</span><b id="cnt">0</b></div>
  </div>
</div>

<div class="card">
  <h3>3. SPEC 修复验证清单</h3>
  <div id="checklist">正在加载...</div>
</div>

<div class="card">
  <h3>4. 调试日志</h3>
  <pre id="log">// 打开浏览器控制台查看更详细的信息</pre>
</div>

<script>
const API = '/gojs/api';
const log = (m, cls='') => {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.textContent = `[${t}] ${m}\n` + el.textContent;
  if (cls) el.className = cls;
};

async function api(path, opts = {}) {
  const url = `${API}.php?api=${path}`;
  log(`GET ${url}`);
  const start = performance.now();
  try {
    const r = await fetch(url, { credentials: 'include', ...opts });
    const ms = (performance.now() - start).toFixed(0);
    const txt = await r.text();
    log(`  ✓ ${r.status} (${ms}ms) ${txt.slice(0, 80)}...`);
    try { return { ok: r.ok, status: r.status, data: JSON.parse(txt), ms }; }
    catch { return { ok: r.ok, status: r.status, data: txt, ms }; }
  } catch (e) {
    log(`  ✗ ${e.message}`, 'err');
    return { ok: false, error: e.message };
  }
}

async function testBackend() {
  const r = await api('');
  document.getElementById('backend-output').textContent = JSON.stringify(r, null, 2);
}

async function testSystem() {
  const r = await api('system.info');
  document.getElementById('backend-output').textContent = JSON.stringify(r, null, 2);
}

async function testHealth() {
  const r = await api('monitor/status');
  document.getElementById('backend-output').textContent = JSON.stringify(r, null, 2);
}

async function testFiles() {
  const r = await api('files/list');
  document.getElementById('backend-output').textContent = JSON.stringify(r, null, 2);
}

let timer = null, count = 0;
async function startMetrics() {
  if (timer) return;
  timer = setInterval(async () => {
    const r = await api('monitor/status');
    count++;
    document.getElementById('cnt').textContent = count;
    document.getElementById('rtt').textContent = `${r.ms || '—'} ms`;
    if (r.data && typeof r.data === 'object') {
      const cpu = r.data.cpu?.usage ?? '—';
      const mem = r.data.memory?.percent ?? r.data.memory?.used ?? '—';
      document.getElementById('cpu').textContent = typeof cpu === 'number' ? cpu.toFixed(1) + '%' : cpu;
      document.getElementById('mem').textContent = typeof mem === 'number' ? mem.toFixed(1) + '%' : mem;
    }
  }, 2000);
  log('开始采样');
}
function stopMetrics() {
  if (timer) { clearInterval(timer); timer = null; log('已停止采样'); }
}

const items = [
  'API 循环引用已修复 (src/api/index.ts)',
  'core 默认导出错误已修复 (src/core/index.ts)',
  '17 个缺失类型已补全 (src/core/types.ts)',
  'HealthChecker.getHealthStatus() 已实现',
  'ConnectionManager 5 个新方法已实现',
  'FileOperator.batchOperation() 已实现',
  'DataCollector.subscribe/broadcast 重构完成',
  'DataFlowManager 3 个方法已实现',
  'CacheManager 已新建 (src/cache/cache-manager.ts)',
  'services.ts 浏览器兼容已修复',
  'Progress/Tabs/Alert 3 个 UI 组件已新建',
  'PerformanceMonitor.tsx 导入路径已修正',
  'i18n zh/en performance 命名空间已补全',
  'SecurityManager 已创建',
  'BackupManager 已创建',
  'MigrationManager 已创建',
  'CacheLayer 已创建',
  'AuditLogger 已创建',
  'SyncManager 已创建',
  'SearchEngine 已创建',
  'PreviewEngine 已创建',
  'performance-tester.ts 空数组守卫已添加',
  'integration.ts WebSocket 重连已实现',
];
document.getElementById('checklist').innerHTML = items.map(i => `✅ ${i}`).join('<br>');

log('预览页面已就绪');
</script>
</body>
</html>
